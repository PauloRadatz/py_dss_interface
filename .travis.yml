language: python
dist: xenial
cache: false
env:
  global:
    - os: windows
    - SEGFAULT_SIGNALS=all
    - LANG=en_US.UTF-8
matrix:
  include:
    - python: '3.9'
      env:
        - TOXENV=check
    - python: '3.9'
      env:
        - TOXENV=docs
    - env:
        - TOXENV=py39,codecov
      python: '3.9'
    - env:
        - TOXENV=py310,codecov
      python: '3.10'
    - env:
        - TOXENV=py311,codecov
      python: '3.11'
    - env:
        - TOXENV=py312,codecov
      python: '3.12'
before_install:
  - python --version
  - uname -a
  - lsb_release -a || true
install:
  - python -mpip install --progress-bar=off tox -rci/requirements.txt
  - virtualenv --version
  - easy_install --version
  - pip --version
  - tox --version
script:
  - tox -v
after_failure:
  - more .tox/log/* | cat
  - more .tox/*/log/* | cat
notifications:
  email:
    on_success: never
    on_failure: always
